services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sahakar_seva}
      POSTGRES_USER: ${POSTGRES_USER:-sahakar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sahakar}
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/api
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sahakar}:${POSTGRES_PASSWORD:-sahakar}@db:5432/${POSTGRES_DB:-sahakar_seva}
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4173
      # Server-only auth verification settings, read from the root .env (blank -> fail closed with 503)
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      # ILLUSTRATIVE example inputs for `fee_policy bootstrap-example` only; live pricing = active fee_policies row
      PLATFORM_FEE_BPS: ${PLATFORM_FEE_BPS:-1000}
      PLATFORM_FEE_CAP_BPS: ${PLATFORM_FEE_CAP_BPS:-1500}
      # External RFC 3161 timestamping of ledger checkpoints (blank -> LOCAL_ONLY; nothing is sent anywhere).
      # TSA_CA_FILE is the pinned trust anchor, relative to /app (e.g. trust/tsa/digicert-trusted-root-g4.pem).
      TSA_URL: ${TSA_URL:-}
      TSA_NAME: ${TSA_NAME:-}
      TSA_CA_FILE: ${TSA_CA_FILE:-}
      ANCHOR_WORKER_ENABLED: ${ANCHOR_WORKER_ENABLED:-true}
      ANCHOR_WORKER_INTERVAL_SECONDS: ${ANCHOR_WORKER_INTERVAL_SECONDS:-20}
      # Local demo identity — disabled unless explicitly enabled; refused unless APP_ENV=development
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-false}
      DEV_AUTH_SECRET: ${DEV_AUTH_SECRET:-}
      DEV_AUTH_PASSCODE: ${DEV_AUTH_PASSCODE:-}
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/app
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      # "supabase" (default) or "dev" (local demo identity; requires DEV_AUTH_ENABLED=true on the API)
      VITE_AUTH_MODE: ${VITE_AUTH_MODE:-supabase}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  postgres_data:
    name: sahakar_seva_postgres_data
  web_node_modules:
