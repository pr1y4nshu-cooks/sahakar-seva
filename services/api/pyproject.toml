[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sahakar-seva-api"
version = "0.1.0"
description = "SAHAKAR-SEVA foundation API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
  "python-jose[cryptography]>=3.3,<4",
  "httpx>=0.27,<1",
  # 0005 trust ledger: RFC 8785 canonical JSON and RFC 3161 ASN.1 (mature implementations, not hand-written)
  "rfc8785>=0.1.4,<1",
  "asn1crypto>=1.5,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
