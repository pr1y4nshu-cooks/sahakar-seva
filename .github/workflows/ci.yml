name: CI

# Safe-by-default CI: frontend checks + backend tests against an ISOLATED, ephemeral
# PostGIS database created inside the Actions runner. No production or development
# database is reachable, and no Supabase or TSA secrets are required or used.

on:
  push:
    branches: [shresthBranch, main]
  pull_request:
    branches: [shresthBranch, main]

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  backend:
    name: Backend (pytest with isolated PostGIS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgis/postgis:16-3.4
        # Ephemeral, runner-local credentials. The database name contains "test",
        # which the test harness requires before it will connect (app/db/testing.py).
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sahakar_seva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sahakar_seva_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Isolated test DB only. Migrations (run by the test harness) create the
      # postgis and btree_gist extensions as the superuser role above.
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sahakar_seva_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest
