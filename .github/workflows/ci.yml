name: CI

# Safe-by-default CI: frontend checks + backend tests against an ISOLATED, ephemeral
# PostGIS database created inside the Actions runner. No production or development
# database is reachable, and no Supabase or TSA secrets are required or used.

on:
  push:
    branches: [shresthBranch, main]
  pull_request:
    branches: [shresthBranch, main]

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  backend:
    name: Backend (pytest with isolated PostGIS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgis/postgis:16-3.4
        # The postgis image auto-initializes POSTGRES_DB with the full PostGIS stack
        # (incl. postgis_tiger_geocoder). We therefore boot a throwaway "postgres" DB and
        # create a FRESH test database from template1 below, so the test DB contains only
        # the extensions our migrations create (postgis + btree_gist) — mirroring the local
        # services/api/scripts/create_test_database.sh and keeping the schema-drift test valid.
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Isolated test DB only (name contains "test", required by app/db/testing.py; differs
      # from DATABASE_URL). Migrations create postgis and btree_gist as the superuser.
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sahakar_seva_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Create fresh isolated test database (no tiger geocoder)
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://postgres:postgres@localhost:5432/postgres", autocommit=True) as c:
              exists = c.execute("SELECT 1 FROM pg_database WHERE datname='sahakar_seva_test'").fetchone()
              if not exists:
                  # TEMPLATE template0 guarantees a clean DB with no PostGIS stack pre-installed.
                  c.execute("CREATE DATABASE sahakar_seva_test TEMPLATE template0")
          print("test database ready")
          PY
      - name: Run tests
        run: pytest
